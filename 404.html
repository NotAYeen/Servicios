<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - No Encontrado | Anton Flores</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f0f0e6">
  <link rel="icon" type="image/webp" href="assets/yo1.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=30">
  <script src="script.js?v=30" defer></script>
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    
    .error-title {
      font-size: clamp(6rem, 15vw, 15rem);
      line-height: 0.9;
      margin-bottom: 2rem;
      color: var(--text-color);
    }
    
    .error-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      margin-bottom: 3rem;
      max-width: 600px;
    }
    
    .error-button {
      display: inline-block;
      padding: 1rem 3rem;
      background-color: var(--accent-color);
      color: var(--bg-color);
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 50px;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    
    .error-button:hover {
      transform: scale(1.05);
      background-color: var(--text-color);
    }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-outline" id="cursorOutline"></div>
  
  <main class="error-container">
    <h1 class="error-title font-anton">404</h1>
    <p class="error-subtitle">Ups... parece que te has perdido en el ciberespacio. La página que buscas no existe.</p>
    <a href="index.html" class="error-button">VOLVER AL INICIO</a>
  </main>
</body>
</html>
